name: Deploy Static Demo to GitHub Pages

on:
  push:
    branches: [codex/port-zip-to-laravel-ci-test, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm run build:react
        env:
          VITE_STATIC_DEMO: '1'
          GITHUB_PAGES: '1'
      - name: Add SPA fallback and .nojekyll
        run: |
          cp public/app/index.html public/app/404.html
          touch public/app/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

