name: NovaSMM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, bcmath, pdo_mysql, gd, openssl, fileinfo, tokenizer, ctype, json
          coverage: none

      - name: Assert PHP 8.2+
        run: php -r 'if (version_compare(PHP_VERSION, "8.2.0", "<")) { fwrite(STDERR, "PHP 8.2+ required, found ".PHP_VERSION."\n"); exit(1); } echo "PHP ".PHP_VERSION."\n";'

      - name: Validate composer.json
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish
          else
            echo "composer.json missing" && exit 1
          fi

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Verify Nova branding asset
        run: |
          if [ -f public/assets/css/nova-theme.css ]; then
            echo "Nova theme present"
          else
            echo "nova-theme.css missing" && exit 1
          fi
